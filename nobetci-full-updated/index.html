const API_ENDPOINT = "/.netlify/functions/chat";
const DB_NAME = "nobetci-isg";
const DB_VERSION = 3;
const STORES = ["equipment", "notifications", "trainings", "kkd", "settings"];

function getDBInstance() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => resolve(req.result);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath:"id" }); });
    };
  });
}
async function saveData(storeName, data) {
  try { const db = await getDBInstance(); db.transaction(storeName, "readwrite").objectStore(storeName).put(data); } catch (e) { console.error(e); }
}
async function loadAllData(storeName) {
  try {
    const db = await getDBInstance();
    return new Promise((resolve) => {
      const req = db.transaction(storeName, "readonly").objectStore(storeName).getAll();
      req.onsuccess = () => resolve(req.result || []);
    });
  } catch (e) { return []; }
}

  const [hazardClass, setHazardClass] = useState("tehlikeli");
  const [kkdList, setKkdList] = useState([]);
  const workerName = "Ahmet Yıldız";

  const fileInputRef = useRef(null);
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const scrollRef = useRef(null);

  useEffect(() => { scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior:"smooth" }); }, [messages]);

  useEffect(() => {
    setMessages([{ role:"assistant", text:"İş Sağlığı ve Güvenliği ile ilgili sorularınızı yanıtlayabilirim. Bir tehlike bildirirseniz, doğru değerlendirebilmem için önce birkaç soru soracağım. Periyodik kontroller, eğitim takvimin veya KKD durumun hakkında da sorabilirsin. Nasıl yardımcı olabilirim?", time:nowLabel() }]);

    loadAllData("notifications").then(setNotifications);

    loadAllData("equipment").then(rows => {
      if (rows.length) setControls(rows);
      else { setControls(DEFAULT_CONTROLS); DEFAULT_CONTROLS.forEach(c => saveData("equipment", c)); }
    });

    loadAllData("trainings").then(rows => {
      if (rows.length) setTrainings(rows);
      else { setTrainings(DEFAULT_TRAININGS); DEFAULT_TRAININGS.forEach(t => saveData("trainings", t)); }
    });

    loadAllData("kkd").then(rows => {
      if (rows.length) setKkdList(rows);
      else { setKkdList(DEFAULT_KKD); DEFAULT_KKD.forEach(k => saveData("kkd", k)); }
    });

    loadAllData("settings").then(rows => {
      const hz = rows.find(r => r.id === "hazardClass");
      if (hz) setHazardClass(hz.value);
    });
  }, []);

  function nowLabel() { return new Date().toLocaleTimeString("tr-TR", { hour:"2-digit", minute:"2-digit" }); }
  function todayLabel() { return new Date().toLocaleDateString("tr-TR"); }

  function updateHazardClass(val) {
    setHazardClass(val);
    saveData("settings", { id:"hazardClass", value:val });
  }

  async function sendMessage(text) {
    if (!text.trim() || loading) return;
    const newMessages = [...messages, { role:"user", text, time:nowLabel() }];
    setMessages(newMessages); setInput(""); setLoading(true);
    try {
      const response = await fetch(API_ENDPOINT, {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ max_tokens:1200, system: SYSTEM_PROMPT, messages: newMessages.map(m => ({ role:m.role, content:m.text })) }),
      });
      if (!response.ok) throw new Error("api_error");
      const data = await response.json();
      const textBlock = data?.content?.find(c => c.type==="text");
      const replyText = textBlock ? textBlock.text : "Cevap oluşturulamadı.";
      setMessages(prev => [...prev, { role:"assistant", text: replyText, time: nowLabel() }]);
    } catch (err) {
      setMessages(prev => [...prev, { role:"assistant", text:"Bağlantı hatası. Acil durum varsa 112'yi arayın.", time: nowLabel() }]);
    } finally { setLoading(false); }
  }

  function askQuickAction(qa) {
    setMessages(prev => [...prev, { role:"user", text:qa.prompt, time:nowLabel() }, { role:"assistant", text:qa.answer, time:nowLabel() }]);
  }

  function copyMessage(text, idx) {
    navigator.clipboard?.writeText(text).then(() => {
      setCopiedIdx(idx);
      setTimeout(() => setCopiedIdx(null), 1500);
    });
  }

  function clearChat() {
    setMessages([{ role:"assistant", text:"Sohbet temizlendi. Nasıl yardımcı olabilirim?", time:nowLabel() }]);
  }

  function handlePhotoSelected(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      const dataUrl = reader.result;
      const base64 = dataUrl.split(",")[1];
      setMessages(prev => [...prev, { role:"user", text:"Bu fotoğrafta tehlike var mı?", image:dataUrl, time:nowLabel() }]);
      setLoading(true);
      try {
        const response = await fetch(API_ENDPOINT, {
          method:"POST", headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ max_tokens:1200, system: SYSTEM_PROMPT, messages:[{ role:"user", content:[{ type:"image", source:{ type:"base64", media_type:"image/jpeg", data:base64 } }, { type:"text", text:"Saha fotoğrafı — tehlike analizi yap ve risk seviyesini gerekçeli belirt." }] }] }),
        });
        if (!response.ok) throw new Error("api_error");
        const data = await response.json();
        const textBlock = data?.content?.find(c => c.type==="text");
        setMessages(prev => [...prev, { role:"assistant", text: textBlock ? textBlock.text : "Analiz yapılamadı.", time:nowLabel() }]);
      } catch (err) {
        setMessages(prev => [...prev, { role:"assistant", text:"Fotoğraf analiz edilemedi.", time:nowLabel() }]);
      } finally { setLoading(false); }
    };
    reader.readAsDataURL(file);
  }

  // ---- Bildirim Merkezi ----
  async function submitNotification() {
    if (!notifDesc.trim()) return;
    const notif = { id:Date.now(), type:notifType, category:notifCategory, desc:notifDesc.trim(), status:"pending", worker:workerName, date:todayLabel(), aiAnalysis:null };
    const updated = [notif, ...notifications];
    setNotifications(updated); saveData("notifications", notif);
    setNotifDesc(""); setNotifFormOpen(false);

    try {
      const response = await fetch(API_ENDPOINT, {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ max_tokens:600, system: SYSTEM_PROMPT, messages:[{ role:"user", content:`Bildirim türü: ${notifType === "ramakKala" ? "Ramak Kala" : notifType === "tehlike" ? "Tehlike" : "İş Kazası"}. Tehlike kategorisi: ${notifCategory}. Açıklama: "${notif.desc}". Bu bildirime kısa bir ön analiz yap: olası risk seviyesi (gerekçeli) ve İSG uzmanının dikkat etmesi gereken noktalar. 3-4 madde, kısa.` }] }),
      });
      const data = await response.json();
      const textBlock = data?.content?.find(c => c.type==="text");
      const analyzed = { ...notif, status:"ai_analyzed", aiAnalysis: textBlock ? textBlock.text : "AI analizi alınamadı." };
      setNotifications(prev => prev.map(n => n.id === notif.id ? analyzed : n));
      saveData("notifications", analyzed);
    } catch (e) {
      const failed = { ...notif, status:"ai_analyzed", aiAnalysis:"AI analizine şu an ulaşılamadı, uzman manuel değerlendirecek." };
      setNotifications(prev => prev.map(n => n.id === notif.id ? failed : n));
      saveData("notifications", failed);
    }
  }

  function quickReport(desc, category, type="tehlike") {
    setNotifType(type); setNotifCategory(category); setNotifDesc(desc);
    setActivePanel("notif"); setNotifFormOpen(true);
  }

  const notifStatusMeta = (status) => {
    if (status === "pending") return { label:"AI Analiz Ediyor…", bg:theme.pendingBg, color:theme.pendingText };
    if (status === "ai_analyzed") return { label:"Uzman İncelemesinde", bg:theme.warnBg, color:theme.warnText };
    if (status === "approved") return { label:"Onaylandı — Görev Oluştu", bg:theme.successBg, color:theme.successText };
    return { label:status, bg:theme.surfaceAlt, color:theme.textMuted };
  };

  // ---- Periyodik Kontrol ----
  function controlStatus(item) {
    if (!item.lastCheck) return { label:"Kayıt Yok", bg:theme.warnBg, color:theme.warnText, urgent:true };
    const next = addMonths(item.lastCheck, item.periodMonths);
    const diff = daysBetween(next, new Date());
    if (diff < 0) return { label:`Gecikti · ${Math.abs(diff)} gün`, bg:theme.highRiskBg, color:theme.highRiskText, urgent:true };
    if (diff <= 30) return { label:`${diff} gün kaldı`, bg:theme.warnBg, color:theme.warnText, urgent:true };
    return { label:`Güncel · ${diff} gün kaldı`, bg:theme.successBg, color:theme.successText, urgent:false };
  }
  function markControlChecked(id) {
    const updated = controls.map(c => c.id === id ? { ...c, lastCheck: todayISO() } : c);
    setControls(updated); saveData("equipment", updated.find(c => c.id === id));
  }
  function attachScanToControl(id) {
    const updated = controls.map(c => c.id === id ? { ...c, qr: scanResult, lastCheck: todayISO() } : c);
    setControls(updated); saveData("equipment", updated.find(c => c.id === id));
    setScanResult(null); setScanTargetOpen(false);
  }
  function reportControlIssue(item) {
    quickReport(`${item.label} — arıza/sorun bildirimi`, "Diğer", "tehlike");
  }

  // ---- Eğitim ----
  const hazardInfo = HAZARD_CLASSES.find(h => h.val === hazardClass);
  function trainingStatus(t) {
    if (!t.completedDate) return { label:"Hiç Alınmadı", bg:theme.warnBg, color:theme.warnText, urgent:true, next:null };
    const next = addMonths(t.completedDate, hazardInfo.renewalMonths);
    const diff = daysBetween(next, new Date());
    if (diff < 0) return { label:`Süresi Doldu · ${Math.abs(diff)} gün`, bg:theme.highRiskBg, color:theme.highRiskText, urgent:true, next };
    if (diff <= 45) return { label:`Yenileme ${diff} gün içinde`, bg:theme.warnBg, color:theme.warnText, urgent:true, next };
    return { label:`Geçerli · ${diff} gün kaldı`, bg:theme.successBg, color:theme.successText, urgent:false, next };
  }
  function markTrainingCompleted(id) {
    const updated = trainings.map(t => t.id === id ? { ...t, completedDate: todayISO() } : t);
    setTrainings(updated); saveData("trainings", updated.find(t => t.id === id));
  }

  // ---- KKD ----
  function setKkdStatus(id, status) {
    const updated = kkdList.map(k => k.id === id ? { ...k, status, lastUpdate: todayISO() } : k);
    setKkdList(updated); saveData("kkd", updated.find(k => k.id === id));
    if (status === "hasarli") { const item = updated.find(k => k.id === id); quickReport(`${item.item} (${item.area}) hasarlı/eksik — yenisi gerekiyor`, "KKD Eksikliği", "tehlike"); }
  }
  const kkdMeta = (status) => {
    if (status === "verildi") return { label:"Bende Var", bg:theme.successBg, color:theme.successText };
    if (status === "hasarli") return { label:"Hasarlı / Eksik", bg:theme.highRiskBg, color:theme.highRiskText };
    return { label:"Durum Belirtilmedi", bg:theme.warnBg, color:theme.warnText };
  };

  // ---- Genel özet metrikleri (çalışan bazlı) ----
  const myNotifs = notifications.filter(n => n.worker === workerName);
  const openNotifs = myNotifs.filter(n => n.status !== "approved").length;
  const urgentControls = controls.filter(c => controlStatus(c).urgent).length;
  const urgentTrainings = trainings.filter(t => trainingStatus(t).urgent).length;
  const missingKkd = kkdList.filter(k => k.status !== "verildi").length;
  const riskCategoryCounts = useMemo(() => {
    const counts = {};
    myNotifs.filter(n => n.status !== "approved").forEach(n => { counts[n.category || "Diğer"] = (counts[n.category || "Diğer"] || 0) + 1; });
    return Object.entries(counts).sort((a,b) => b[1]-a[1]);
  }, [notifications]);

  // ============ RENDER: CHAT ============
  const renderChatPanel = () => (
    <div className="flex-1 flex flex-col" style={{ background: theme.bg }}>
      <div className="flex items-center justify-between px-4 py-2 border-b shrink-0" style={{ borderColor:theme.border, background:theme.header }}>
        <p className="text-[10.5px] font-semibold uppercase tracking-wide" style={{ color:theme.textFaint }}>Sık Sorulanlar</p>
        <button onClick={clearChat} className="flex items-center gap-1 text-[10.5px] font-semibold" style={{ color:theme.textMuted }}>
          <Trash2 style={{ fontSize:"12px" }} /> Sohbeti Temizle
        </button>
      </div>
      <div className="flex gap-2 px-4 py-2 overflow-x-auto shrink-0 border-b" style={{ background:theme.bg, borderColor:theme.border }}>
        {QUICK_ACTIONS.map(qa => (
          <button key={qa.label} onClick={() => askQuickAction(qa)} disabled={loading} className="flex items-center gap-1.5 whitespace-nowrap rounded-full px-3 py-1.5 text-[11px] shrink-0 disabled:opacity-50" style={{ border:`1px solid ${theme.border}`, background:theme.surfaceAlt, color:theme.textPrimary }}>
            <qa.icon style={{ fontSize:"13px", color:theme.accent }} /> {qa.label}
          </button>
        ))}
      </div>
      <div ref={scrollRef} className="flex-1 overflow-y-auto px-4 py-3 flex flex-col gap-2.5">
        {messages.map((m, i) => (
          <div key={i} className="flex flex-col" style={{ animation:"fadeIn 0.25s ease-out" }}>
            <div className={`flex items-end gap-2 ${m.role==="user"?"justify-end":"justify-start"}`}>
              {m.role==="assistant" && (
                <div className="w-6 h-6 rounded-full flex items-center justify-center shrink-0 mb-3.5" style={{ background:theme.accent }}>
                  <HardHat style={{ fontSize:"14px", color:theme.onAccent }} sw={2.5} />
                </div>
              )}
              <div className="flex flex-col max-w-[80%]">
                <div className="rounded-2xl px-3.5 py-2.5 text-[13.5px] leading-snug whitespace-pre-wrap" style={m.role==="user" ? { background:theme.accent, color:theme.onAccent, borderBottomRightRadius:"0.25rem", fontWeight:500 } : { background:theme.bubbleAssistantBg, color:theme.bubbleAssistantText, border:`1px solid ${theme.border}`, borderBottomLeftRadius:"0.25rem" }}>
                  {m.image && <img src={m.image} alt="Fotoğraf" className="rounded-lg mb-2 max-h-40 w-full object-cover" />}
                  {m.text}
                </div>
                <div className={`flex items-center gap-2 mt-1 ${m.role==="user"?"justify-end":"justify-start"}`}>
                  <span className="text-[10px]" style={{ color:theme.textFaint }}>{m.time}</span>
                  {m.role === "assistant" && (
                    <button onClick={() => copyMessage(m.text, i)} className="text-[10px] flex items-center gap-0.5" style={{ color: copiedIdx === i ? theme.successText : theme.textFaint }}>
                      <Copy style={{ fontSize:"10px" }} /> {copiedIdx === i ? "Kopyalandı" : "Kopyala"}
                    </button>
                  )}
                </div>
              </div>
            </div>
          </div>
        ))}
        {loading && (
          <div className="flex items-end gap-2 justify-start">
            <div className="w-6 h-6 rounded-full flex items-center justify-center shrink-0" style={{ background:theme.accent }}>
              <HardHat style={{ fontSize:"14px", color:theme.onAccent }} sw={2.5} />
            </div>
            <div className="rounded-2xl px-3 py-2" style={{ background:theme.bubbleAssistantBg, border:`1px solid ${theme.border}`, borderBottomLeftRadius:"0.25rem" }}>
              <div className="flex gap-1"><span className="w-1.5 h-1.5 rounded-full animate-bounce" style={{ background:theme.textFaint }} /><span className="w-1.5 h-1.5 rounded-full animate-bounce" style={{ background:theme.textFaint, animationDelay:"150ms" }} /><span className="w-1.5 h-1.5 rounded-full animate-bounce" style={{ background:theme.textFaint, animationDelay:"300ms" }} /></div>
            </div>
          </div>
        )}
      </div>
      <input ref={fileInputRef} type="file" accept="image/*" onChange={handlePhotoSelected} style={{ display:"none" }} />
      <div className="flex items-center gap-2 px-3 py-3 border-t shrink-0" style={{ borderColor:theme.border, background:theme.header }}>
        <button onClick={() => fileInputRef.current?.click()} disabled={loading} className="w-10 h-10 rounded-full flex items-center justify-center shrink-0 disabled:opacity-40" style={{ background:theme.surfaceAlt, border:`1px solid ${theme.border}` }}>
          <Camera style={{ fontSize:"16px", color:theme.textMuted }} />
        </button>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendMessage(input)} placeholder="Sorunuzu yazın..." className="flex-1 text-sm rounded-full px-4 py-2.5 outline-none border" style={{ background:theme.surfaceAlt, borderColor:theme.border, color:theme.textPrimary }} />
        <button onClick={() => sendMessage(input)} disabled={loading || !input.trim()} className="w-10 h-10 rounded-full flex items-center justify-center shrink-0 disabled:opacity-40" style={{ background:theme.accent }}>
          <Send style={{ fontSize:"16px", color:theme.onAccent }} sw={2.5} />
        </button>
      </div>
    </div>
  );

  // ============ RENDER: BİLDİRİM (+ Sahadaki Riskler özeti) ============
  const renderNotifPanel = () => (
    <div className="flex-1 flex flex-col" style={{ background:theme.bg }}>
      <div className="flex-1 overflow-y-auto px-4 py-4">
        <p className="font-[Oswald] text-lg uppercase tracking-wide mb-1" style={{ color:theme.textPrimary }}>Bildirim Merkezi</p>
        <p className="text-xs mb-3" style={{ color:theme.textFaint }}>Bildirirsin → AI ön analiz yapar → İSG uzmanı inceler → onaylanınca işverene görev düşer</p>

        {riskCategoryCounts.length > 0 && (
          <div className="rounded-xl border px-3.5 py-3 mb-3" style={{ borderColor:theme.border, background:theme.surface }}>
            <p className="text-[11px] font-semibold uppercase tracking-wide mb-2 flex items-center gap-1" style={{ color:theme.textFaint }}><AlertTriangle style={{ fontSize:"12px" }} /> Sahadaki Açık Riskler</p>
            <div className="flex flex-wrap gap-1.5">
              {riskCategoryCounts.map(([cat, count]) => (
                <span key={cat} className="text-[10.5px] font-semibold px-2.5 py-1 rounded-full" style={{ background:theme.highRiskBg, color:theme.highRiskText }}>{cat} · {count}</span>
              ))}
            </div>
          </div>
        )}

        <button onClick={() => setNotifFormOpen(v => !v)} className="w-full py-2.5 rounded-lg font-semibold mb-3 flex items-center justify-center gap-1.5" style={{ background:theme.accent, color:theme.onAccent }}>
          <Plus style={{ fontSize:"14px" }} sw={2.5} /> Yeni Bildirim
        </button>

        {notifFormOpen && (
          <div className="rounded-xl border px-3.5 py-3 mb-3" style={{ borderColor:theme.border, background:theme.surfaceAlt }}>
            <div className="flex gap-2 mb-2">
              {[["ramakKala","Ramak Kala"],["tehlike","Tehlike"],["kaza","İş Kazası"]].map(([val,label]) => (
                <button key={val} onClick={() => setNotifType(val)} className="flex-1 text-[11px] py-1.5 rounded-lg font-semibold" style={notifType===val ? { background:theme.accent, color:theme.onAccent } : { background:theme.surface, color:theme.textMuted, border:`1px solid ${theme.border}` }}>{label}</button>
              ))}
            </div>
            <p className="text-[10.5px] font-semibold mb-1" style={{ color:theme.textFaint }}>Tehlike Kategorisi</p>
            <select value={notifCategory} onChange={e=>setNotifCategory(e.target.value)} className="w-full text-sm rounded-lg px-3 py-2 mb-2 outline-none border" style={{ background:theme.surface, borderColor:theme.border, color:theme.textPrimary }}>
              {HAZARD_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <textarea value={notifDesc} onChange={e=>setNotifDesc(e.target.value)} placeholder="Ne oldu, nerede? Kısaca açıklayın..." rows={3} className="w-full text-sm rounded-lg px-3 py-2 mb-2 outline-none border resize-none" style={{ background:theme.surface, borderColor:theme.border, color:theme.textPrimary }} />
            <button onClick={submitNotification} disabled={!notifDesc.trim()} className="w-full text-sm font-semibold py-2 rounded-lg disabled:opacity-40" style={{ background:theme.accent, color:theme.onAccent }}>Gönder</button>
          </div>
        )}

        {myNotifs.length === 0 && (
          <p className="text-xs text-center py-6" style={{ color:theme.textFaint }}>Henüz bildirim yok.</p>
        )}

        {myNotifs.map(n => {
          const meta = notifStatusMeta(n.status);
          return (
            <div key={n.id} className="rounded-xl border px-3.5 py-3 mb-2.5" style={{ borderColor:theme.border, background:theme.surface }}>
              <div className="flex items-start justify-between gap-2 mb-1">
                <p className="text-sm font-semibold leading-snug" style={{ color:theme.textPrimary }}>{n.desc}</p>
                <span className="shrink-0 text-[9.5px] font-semibold px-2 py-0.5 rounded-full whitespace-nowrap" style={{ background:meta.bg, color:meta.color }}>{meta.label}</span>
              </div>
              <p className="text-[11px]" style={{ color:theme.textFaint }}>{n.date} • {n.category} • {n.type === "ramakKala" ? "Ramak Kala" : n.type === "tehlike" ? "Tehlike" : "İş Kazası"}</p>
              {n.aiAnalysis && (
                <div className="mt-2 rounded-lg px-2.5 py-2 text-[11.5px] whitespace-pre-wrap" style={{ background:theme.surfaceAlt, color:theme.textMuted }}>
                  <span className="font-semibold" style={{ color:theme.textPrimary }}>AI Ön Analiz:</span>{"\n"}{n.aiAnalysis}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );

  // ============ RENDER: PERİYODİK KONTROL ============
  function startQRScan() {
    if (navigator.mediaDevices?.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } }).then(stream => {
        if (videoRef.current) { videoRef.current.srcObject = stream; videoRef.current.onloadedmetadata = () => { videoRef.current.play(); scanQRLoop(); }; }
      });
    }
  }
  function scanQRLoop() {
    if (canvasRef.current && videoRef.current) {
      const canvas = canvasRef.current; const ctx = canvas.getContext("2d");
      canvas.width = videoRef.current.videoWidth; canvas.height = videoRef.current.videoHeight;
      ctx.drawImage(videoRef.current, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, canvas.width, canvas.height);
      if (code) { setScanResult(code.data); setScanTargetOpen(true); videoRef.current.srcObject?.getTracks().forEach(t => t.stop()); }
      else requestAnimationFrame(scanQRLoop);
    }
  }

  const renderControlPanel = () => (
    <div className="flex-1 flex flex-col" style={{ background:theme.bg }}>
      <div className="flex-1 overflow-y-auto px-4 py-4">
        <p className="font-[Oswald] text-lg uppercase tracking-wide mb-1" style={{ color:theme.textPrimary }}>Periyodik Kontrol</p>
        <p className="text-xs mb-3" style={{ color:theme.textFaint }}>İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği'ne göre genel kontrol periyotları. Kesin süre ve yetkili kuruluş için işyeri İSG uzmanına danışın.</p>

        {!scanTargetOpen ? (
          <button onClick={startQRScan} className="w-full py-3 rounded-xl border-2 text-center font-semibold mb-3 flex items-center justify-center gap-2" style={{ borderColor:theme.accent, background:theme.surfaceAlt, color:theme.accent }}>
            <QrCode style={{ fontSize:"16px" }} /> Ekipman QR Tara ve Yerinde İşaretle
          </button>
        ) : (
          <div className="rounded-xl p-3.5 mb-3" style={{ background:theme.successBg }}>
            <p className="text-sm mb-2" style={{ color:theme.successText }}>✓ QR Okundu — hangi ekipmana bağlansın?</p>
            <div className="flex flex-col gap-1.5">
              {controls.map(c => (
                <button key={c.id} onClick={() => attachScanToControl(c.id)} className="text-left text-xs rounded-lg px-2.5 py-1.5" style={{ background:theme.surface, color:theme.textPrimary, border:`1px solid ${theme.border}` }}>{c.label}</button>
              ))}
            </div>
            <button onClick={() => { setScanTargetOpen(false); setScanResult(null); }} className="w-full mt-2 py-1.5 rounded-lg text-xs font-semibold" style={{ background:theme.surfaceAlt, color:theme.textMuted }}>Vazgeç</button>
          </div>
        )}
        <video ref={videoRef} style={{ display:"none" }} /><canvas ref={canvasRef} style={{ display:"none" }} />

        {controls.map(c => {
          const meta = controlStatus(c);
          return (
            <div key={c.id} className="rounded-xl border px-3.5 py-3 mb-2.5" style={{ borderColor:theme.border, background:theme.surface }}>
              <div className="flex items-start justify-between gap-2 mb-1">
                <p className="text-sm font-semibold leading-snug" style={{ color:theme.textPrimary }}>{c.label}</p>
                <span className="shrink-0 text-[9.5px] font-semibold px-2 py-0.5 rounded-full whitespace-nowrap" style={{ background:meta.bg, color:meta.color }}>{meta.label}</span>
              </div>
              <p className="text-[11px] mb-2" style={{ color:theme.textFaint }}>Periyot: {c.period}{c.lastCheck ? ` • Son kontrol: ${new Date(c.lastCheck).toLocaleDateString("tr-TR")}` : ""}{c.qr ? " • QR ile eşleşti" : ""}</p>
              <div className="flex gap-2">
                <button onClick={() => markControlChecked(c.id)} className="flex-1 text-[11px] font-semibold py-1.5 rounded-lg flex items-center justify-center gap-1" style={{ background:theme.surfaceAlt, color:theme.textPrimary, border:`1px solid ${theme.border}` }}><CheckCircle2 style={{ fontSize:"12px" }} /> Bugün Kontrol Edildi</button>
                <button onClick={() => reportControlIssue(c)} className="flex-1 text-[11px] font-semibold py-1.5 rounded-lg" style={{ background:theme.highRiskBg, color:theme.highRiskText }}>Arıza/Sorun Bildir</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );

  // ============ RENDER: EĞİTİM ============
  const renderEducationPanel = () => (
    <div className="flex-1 flex flex-col" style={{ background:theme.bg }}>
      <div className="flex-1 overflow-y-auto px-4 py-4">
        <p className="font-[Oswald] text-lg uppercase tracking-wide mb-1" style={{ color:theme.textPrimary }}>Eğitim Takibi</p>
        <p className="text-xs mb-3" style={{ color:theme.textFaint }}>Çalışanların İSG Eğitimlerinin Usul ve Esasları Hakkında Yönetmelik'e göre asgari süre ve yenileme periyodu, işyerinin tehlike sınıfına göre değişir.</p>

        <div className="rounded-xl border px-3.5 py-3 mb-3" style={{ borderColor:theme.border, background:theme.surface }}>
          <p className="text-[10.5px] font-semibold uppercase tracking-wide mb-2" style={{ color:theme.textFaint }}>İşyerimin Tehlike Sınıfı</p>
          <div className="flex gap-2 mb-2">
            {HAZARD_CLASSES.map(h => (
              <button key={h.val} onClick={() => updateHazardClass(h.val)} className="flex-1 text-[11px] py-1.5 rounded-lg font-semibold" style={hazardClass===h.val ? { background:theme.accent, color:theme.onAccent } : { background:theme.surfaceAlt, color:theme.textMuted, border:`1px solid ${theme.border}` }}>{h.label}</button>
            ))}
          </div>
          <p className="text-[11px]" style={{ color:theme.textMuted }}>Asgari eğitim süresi: <b>{hazardInfo.hours} saat</b> • Genel yenileme periyodu: <b>{hazardInfo.renewalMonths/12 >= 1 ? `${hazardInfo.renewalMonths/12} yılda 1` : `${hazardInfo.renewalMonths} ayda 1`}</b></p>
          <p className="text-[10px] mt-1" style={{ color:theme.textFaint }}>Kesin süre ve içerik işyerinin risk değerlendirmesine ve İSG uzmanının planına göre değişebilir.</p>
        </div>

        {trainings.map(t => {
          const meta = trainingStatus(t);
          return (
            <div key={t.id} className="rounded-xl border px-3.5 py-3 mb-2.5" style={{ borderColor:theme.border, background:theme.surface }}>
              <div className="flex items-start justify-between gap-2 mb-1">
                <p className="text-sm font-semibold leading-snug" style={{ color:theme.textPrimary }}>{t.title}</p>
                <span className="shrink-0 text-[9.5px] font-semibold px-2 py-0.5 rounded-full whitespace-nowrap" style={{ background:meta.bg, color:meta.color }}>{meta.label}</span>
              </div>
              <p className="text-[11px] mb-2" style={{ color:theme.textFaint }}>{t.completedDate ? `Son tamamlanma: ${new Date(t.completedDate).toLocaleDateString("tr-TR")}` : "Henüz tamamlanmadı"}</p>
              <button onClick={() => markTrainingCompleted(t.id)} className="w-full text-[11px] font-semibold py-1.5 rounded-lg flex items-center justify-center gap-1" style={{ background:theme.surfaceAlt, color:theme.textPrimary, border:`1px solid ${theme.border}` }}><CheckCircle2 style={{ fontSize:"12px" }} /> Bugün Tamamlandı Olarak İşaretle</button>
            </div>
          );
        })}
      </div>
    </div>
  );

  // ============ RENDER: KKD ============
  const renderKkdPanel = () => (
    <div className="flex-1 flex flex-col" style={{ background:theme.bg }}>
      <div className="flex-1 overflow-y-auto px-4 py-4">
        <p className="font-[Oswald] text-lg uppercase tracking-wide mb-1" style={{ color:theme.textPrimary }}>Kişisel Koruyucu Donanım</p>
        <p className="text-xs mb-3" style={{ color:theme.textFaint }}>KKD Yönetmeliği gereği bu donanımlar işveren tarafından ücretsiz sağlanır, CE işaretli ve risklere uygun olmalıdır. Hasarlı/eksik KKD çalışma güvenliğini doğrudan etkiler — hemen bildirin.</p>

        {kkdList.map(k => {
          const meta = kkdMeta(k.status);
          return (
            <div key={k.id} className="rounded-xl border px-3.5 py-3 mb-2.5" style={{ borderColor:theme.border, background:theme.surface }}>
              <div className="flex items-start justify-between gap-2 mb-1">
                <p className="text-sm font-semibold leading-snug flex items-center gap-1.5" style={{ color:theme.textPrimary }}><span>{k.emoji}</span>{k.item}</p>
                <span className="shrink-0 text-[9.5px] font-semibold px-2 py-0.5 rounded-full whitespace-nowrap" style={{ background:meta.bg, color:meta.color }}>{meta.label}</span>
              </div>
              <p className="text-[11px] mb-2" style={{ color:theme.textFaint }}>{k.area} • Standart: {k.standard}</p>
              <div className="flex gap-2">
                <button onClick={() => setKkdStatus(k.id, "verildi")} className="flex-1 text-[11px] font-semibold py-1.5 rounded-lg" style={{ background:theme.successBg, color:theme.successText }}>Bende Var</button>
                <button onClick={() => setKkdStatus(k.id, "hasarli")} className="flex-1 text-[11px] font-semibold py-1.5 rounded-lg" style={{ background:theme.highRiskBg, color:theme.highRiskText }}>Hasarlı / Eksik Bildir</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );

  return (
    <div className="min-h-screen w-full flex items-center justify-center bg-gray-100 py-4 px-2" style={{ background:theme.pageBg }}>
      <div className="relative w-full max-w-[400px] h-[760px] rounded-[2rem] shadow-2xl overflow-hidden flex flex-col" style={{ border:`8px solid ${theme.bezel}`, background:theme.bg }}>
        <div className="flex items-center justify-between px-4 py-2.5 border-b shrink-0" style={{ borderColor:theme.border, background:theme.header }}>
          <div className="flex items-center gap-2">
            <p className="font-[Oswald] text-[14px] uppercase tracking-wide" style={{ color:theme.textPrimary }}>Nöbetçi</p>
            <span className="text-[9.5px] font-semibold px-2 py-0.5 rounded-full" style={{ background:theme.surfaceAlt, color:theme.textMuted, border:`1px solid ${theme.border}` }}>👷 Çalışan</span>
          </div>
          <button onClick={() => setMode(mode === "light" ? "dark" : "light")} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background:theme.surfaceAlt }}>{mode === "light" ? "🌙" : "☀️"}</button>
        </div>

        {(openNotifs > 0 || urgentControls > 0 || urgentTrainings > 0 || missingKkd > 0) && (
          <div className="flex gap-1.5 px-4 py-2 border-b overflow-x-auto shrink-0" style={{ borderColor:theme.border, background:theme.header }}>
            {openNotifs > 0 && <span className="shrink-0 text-[10px] font-semibold px-2.5 py-1 rounded-full" style={{ background:theme.pendingBg, color:theme.pendingText }}>{openNotifs} açık bildirim</span>}
            {urgentControls > 0 && <span className="shrink-0 text-[10px] font-semibold px-2.5 py-1 rounded-full" style={{ background:theme.warnBg, color:theme.warnText }}>{urgentControls} kontrol dikkat</span>}
            {urgentTrainings > 0 && <span className="shrink-0 text-[10px] font-semibold px-2.5 py-1 rounded-full" style={{ background:theme.warnBg, color:theme.warnText }}>{urgentTrainings} eğitim dikkat</span>}
            {missingKkd > 0 && <span className="shrink-0 text-[10px] font-semibold px-2.5 py-1 rounded-full" style={{ background:theme.highRiskBg, color:theme.highRiskText }}>{missingKkd} KKD eksik</span>}
          </div>
        )}

        {activePanel === "chat" && renderChatPanel()}
        {activePanel === "notif" && renderNotifPanel()}
        {activePanel === "control" && renderControlPanel()}
        {activePanel === "education" && renderEducationPanel()}
        {activePanel === "kkd" && renderKkdPanel()}

        <div className="flex border-t justify-around shrink-0" style={{ borderColor:theme.border, background:theme.header }}>
          <button onClick={() => setActivePanel("chat")} className="flex-1 py-2.5 flex flex-col items-center gap-1" style={{ opacity:activePanel==="chat"?1:0.5 }}><MessageSquare style={{ fontSize:"17px", color:theme.accent }} /><span className="text-[8.5px]">Sohbet</span></button>
          <button onClick={() => setActivePanel("notif")} className="flex-1 py-2.5 flex flex-col items-center gap-1" style={{ opacity:activePanel==="notif"?1:0.5 }}><Bell style={{ fontSize:"17px", color:activePanel==="notif"?theme.accent:theme.textMuted }} /><span className="text-[8.5px]">Bildirim</span></button>
          <button onClick={() => setActivePanel("control")} className="flex-1 py-2.5 flex flex-col items-center gap-1" style={{ opacity:activePanel==="control"?1:0.5 }}><Wrench style={{ fontSize:"17px", color:activePanel==="control"?theme.accent:theme.textMuted }} /><span className="text-[8.5px]">Kontrol</span></button>
          <button onClick={() => setActivePanel("education")} className="flex-1 py-2.5 flex flex-col items-center gap-1" style={{ opacity:activePanel==="education"?1:0.5 }}><BookOpen style={{ fontSize:"17px", color:activePanel==="education"?theme.accent:theme.textMuted }} /><span className="text-[8.5px]">Eğitim</span></button>
          <button onClick={() => setActivePanel("kkd")} className="flex-1 py-2.5 flex flex-col items-center gap-1" style={{ opacity:activePanel==="kkd"?1:0.5 }}><Vest style={{ fontSize:"17px", color:activePanel==="kkd"?theme.accent:theme.textMuted }} /><span className="text-[8.5px]">KKD</span></button>
        </div>
      </div>
      <style>{`@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }`}</style>
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<NobetciPlatform />);
} catch (e) {
  document.body.innerHTML = "<div style='padding:20px; color:red;'><b>Hata:</b> " + e.message + "</div>";
}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("service-worker.js").catch(() => {}); });
}
</script>
</body>
</html>
