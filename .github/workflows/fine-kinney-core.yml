name: Fine-Kinney Core
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fine-kinney-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Fine-Kinney Core (${{ matrix.os }})
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/fine-kinney-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/fine-kinney-core/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run example
      - name: Compare with the unchanged application engine
        run: node tools/verify-upstream.mjs ../../src/constants/fineKinney.js
      - run: npm run audit:dependencies
      - run: npm pack --dry-run
