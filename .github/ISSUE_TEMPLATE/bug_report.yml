name: Hata bildirimi
description: Yeniden üretilebilir bir uygulama veya geliştirme hatası
body:
  - type: markdown
    attributes:
      value: "Güvenlik açığı, API anahtarı, kişisel veri veya gerçek saha fotoğrafı paylaşmayın. Güvenlik için SECURITY.md dosyasını izleyin."
  - type: textarea
    id: problem
    attributes:
      label: Beklenen ve gerçekleşen davranış
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Yeniden üretim adımları
      description: Kişisel veri içermeyen en küçük örnek ve varsa hata çıktısı.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Commit ve ortam
      description: OS, Node/npm veya cihaz/tarayıcı sürümü; PWA olup olmadığı.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Denenen kontroller ve veri etkisi
      description: Veri kaybı şüphesi varsa yedek alın; geri yükleme/sıfırlama yapmayın.
