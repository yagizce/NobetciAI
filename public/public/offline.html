<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bağlantı Yok — Nöbetçi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', Arial, sans-serif;
      background: #EDEAE2;
      color: #2B2822;
    }
    .icon { font-size: 40px; margin-bottom: 12px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #6b6455; max-width: 320px; line-height: 1.6; margin: 0 0 20px; }
    button {
      font-size: 14px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      background: #F2B705;
      color: #2B2822;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>İnternet Bağlantısı Yok</h1>
  <p>Nöbetçi'ye şu an ulaşılamıyor. Daha önce ziyaret ettiğiniz sayfalar bağlantı geri gelene kadar sınırlı çalışabilir. Bağlantınızı kontrol edip tekrar deneyin.</p>
  <button onclick="location.reload()">Tekrar Dene</button>
</body>
</html>
